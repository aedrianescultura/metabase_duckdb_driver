name: Add .jar file to a release

on:
  release:
    types: [published]

  workflow_dispatch:

jobs:
  compat:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.read.outputs.versions }}
      primary: ${{ steps.read.outputs.primary }}
      driver: ${{ steps.read.outputs.driver }}
    steps:
    - uses: actions/checkout@v4

    # versions feeds the image build matrix; primary (the newest listed) also
    # gets :latest; driver comes from deps.edn, the single place the driver
    # version is pinned, and must match the release tag.
    - name: Read compatible Metabase versions
      id: read
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        driver="$(sed -n 's/.*duckdb_jdbc {:mvn\/version "\([^"]*\)".*/\1/p' deps.edn)"
        if [ -n "$RELEASE_TAG" ] && [ "$RELEASE_TAG" != "$driver" ]; then
          echo "::error::Release tag $RELEASE_TAG does not match the driver version $driver in deps.edn"
          exit 1
        fi
        {
          echo "versions=$(jq -c . metabase_versions.json)"
          echo "primary=$(jq -r 'sort_by(split(".") | map(tonumber)) | last' metabase_versions.json)"
          echo "driver=$driver"
        } >> "$GITHUB_OUTPUT"

  build:
    needs: compat
    runs-on: ubuntu-latest

    steps:
    - name: Download .jar artifact
      uses: dawidd6/action-download-artifact@v11
      with:
        workflow: build_metabase_duckdb_driver.yaml
        workflow_conclusion: success
        commit: ${{ github.sha }}
        name: metabase-duckdb-driver

    - name: Add .jar artifact to release
      uses: softprops/action-gh-release@v2.3.2
      with:
        generate_release_notes: true
        files: duckdb.metabase-driver.jar

  images:
    needs: [build, compat]
    if: github.event_name == 'release'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        metabase_version: ${{ fromJSON(needs.compat.outputs.versions) }}
    uses: ./.github/workflows/build_container_images.yaml
    with:
      metabase_version: ${{ matrix.metabase_version }}
      driver_version: ${{ needs.compat.outputs.driver }}
      tag_latest: ${{ matrix.metabase_version == needs.compat.outputs.primary }}
      force_rebuild: true
